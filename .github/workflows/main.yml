name: Build PS3 PKG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  PS3DEV: ${{ github.workspace }}/ps3dev
  PSL1GHT: ${{ github.workspace }}/ps3dev
  NO_SAVANNAH: "1"
  PSL1GHT_REF: dd4e8c9be744e3273d665c393fa6d97a87402e2e
  PS3LIBRARIES_REF: f671e1158e5db2520c172bd600d55d9fce3d15d0
  QUICKJS_REF: 3d5e064e9dd67c70f7962836505a7fa067bf0a4e
  PKG_NAME: subasta-cuartos-v5

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            autoconf automake bison flex gcc g++ make cmake texinfo patch \
            libelf-dev libncurses5-dev python3 python-is-python3 python3-dev \
            subversion wget curl zlib1g-dev libtool-bin bzip2 libgmp3-dev \
            pkg-config libssl-dev

      - name: Restaurar cache de ps3dev
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ps3dev
          key: ps3dev-v1-${{ env.PSL1GHT_REF }}-${{ env.PS3LIBRARIES_REF }}-${{ env.QUICKJS_REF }}-${{ hashFiles('scripts/*.sh') }}

      - name: Preparar toolchain, PSL1GHT y librerias
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup-ps3dev.sh

      - name: Compilar QuickJS para PS3
        id: quickjs
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-quickjs.sh

      - name: Guardar cache de ps3dev
        if: steps.cache.outputs.cache-hit != 'true' && steps.quickjs.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ps3dev
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Compilar el juego y armar el PKG
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          make pkg
          ls -la *.pkg *.self

      - name: Subir artefactos
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            ${{ env.PKG_NAME }}.pkg
            ${{ env.PKG_NAME }}.gnpdrm.pkg
            ${{ env.PKG_NAME }}.self

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "${PKG_NAME}.gnpdrm.pkg" "${PKG_NAME}.pkg" \
            --target "${{ github.sha }}" \
            --title "HaxCup PS3 - build ${{ github.run_number }}" \
            --notes "PKG de HaxCup para PS3. Instalar primero el .gnpdrm.pkg; si la consola no lo acepta, probar el .pkg."
